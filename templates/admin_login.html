<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Panel admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin">
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div style="max-width:340px;margin:20px auto 0;">
    {% for category, msg in messages %}
      <div class="flash {{ 'error' if category=='error' else 'ok' }}">{{ msg }}</div>
    {% endfor %}
    </div>
  {% endif %}
{% endwith %}
<div class="login-box">
  <h1>Instituto de Energía<br>Panel de administración</h1>
  <form method="post">
    <div class="field">
      <label>Usuario (iniciales)</label>
      <input type="text" name="initials" autofocus autocomplete="username" maxlength="10" style="text-transform:uppercase">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" name="password" autocomplete="current-password">
    </div>
    <button class="btn" type="submit" style="width:100%;">Ingresar</button>
  </form>
</div>
</body>
</html>
